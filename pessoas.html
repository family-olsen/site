<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pessoas — Olsen · Belloto · Leal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  .people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
  .people-card{display:block;background:var(--bg-3);border:1px solid var(--line-2);border-radius:4px;overflow:hidden;color:inherit;transition:border-color .3s,transform .3s}
  .people-card:hover{border-color:var(--gold-dark);transform:translateY(-3px)}
  .people-card .ph{height:200px;background:var(--bg-4);background-size:cover;background-position:center 22%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:44px;color:var(--gold)}
  .people-card .info{padding:16px 18px 20px}
  .people-card .nome{display:block;font-family:var(--serif);font-size:19px;margin-bottom:4px}
  .people-card .vida{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
</style>
</head>
<body>
<main>
  <section class="section-tight">
    <div class="wrap">
      <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,64px);margin:0 0 14px;letter-spacing:-.02em" id="pageTitle">Pessoas</h1>
      <p style="font-size:15px;line-height:1.7;color:var(--muted-2);max-width:560px;margin:0 0 12px" id="peopleSummary">Carregando…</p>
      <p style="margin:0 0 30px" id="clearFilterRow"></p>
      <div class="people-grid" id="peopleGrid"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
async function boot(){
  renderHeader(); renderFooter();
  const {data:allPeople,error}=await sbClient.from('people').select('id,full_name,surname,birth_date,death_date,avatar_path').order('full_name',{ascending:true});
  if(error||!allPeople||!allPeople.length){
    $('#peopleSummary').textContent='';
    $('#peopleGrid').innerHTML='<p class="empty-note">Nenhuma pessoa publicada ainda.</p>';
    return;
  }
  const sobrenome=new URLSearchParams(location.search).get('sobrenome');
  const people=sobrenome?allPeople.filter(p=>surnameTokens(p).includes(sobrenome)):allPeople;

  if(sobrenome){
    $('#pageTitle').textContent=sobrenome;
    $('#peopleSummary').textContent=people.length+(people.length===1?' pessoa com esse sobrenome.':' pessoas com esse sobrenome.');
    $('#clearFilterRow').innerHTML='<a href="pessoas.html">← Ver todas as pessoas</a>';
  } else {
    $('#peopleSummary').textContent=people.length+(people.length===1?' pessoa documentada neste acervo.':' pessoas documentadas neste acervo.');
  }

  if(!people.length){
    $('#peopleGrid').innerHTML='<p class="empty-note">Ninguém encontrado com esse sobrenome.</p>';
    return;
  }
  $('#peopleGrid').innerHTML=people.map(p=>`
    <a class="people-card" href="pessoa.html?id=${p.id}">
      <span class="ph" style="${p.avatar_path?`background-image:url('${photoUrl(p.avatar_path)}')`:''}">${p.avatar_path?'':escapeHtml(initials(p.full_name))}</span>
      <span class="info"><span class="nome">${escapeHtml(p.full_name)}</span><span class="vida">${escapeHtml(yearsLabel(p)||'—')}</span></span>
    </a>`).join('');
}
boot();
</script>
</body>
</html>
