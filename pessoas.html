<style>
  .pessoas-head{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(20px,4vw,48px);flex-wrap:wrap;margin-bottom:8px}
  .pessoas-head-left{flex:1 1 260px;min-width:0}
  .pessoas-head-right{flex:0 1 auto;min-width:0}
  .pessoas-head-right .rotulo{display:block;font-size:var(--fs-micro);letter-spacing:.18em;text-transform:uppercase;color:var(--muted-4);margin-bottom:8px;text-align:right}
  .pessoas-head-right .galeria-filtros{justify-content:flex-end}
</style>
</head>
<body>
<main>
  <section class="section-tight" style="padding-bottom:60px;padding-top:clamp(10px,1.5vw,20px)">
    <div class="wrap">
      <div class="pessoas-head">
        <div class="pessoas-head-left">
          <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(30px,5vw,54px);margin:0 0 12px;letter-spacing:-.02em" id="pageTitle">Pessoas</h1>
          <p style="font-size:15px;line-height:1.7;color:var(--muted-2);margin:0" id="peopleSummary">Carregando…</p>
          <p style="margin:8px 0 0" id="clearFilterRow"></p>
        </div>
        <div class="pessoas-head-right">
          <span class="rotulo">Filtrar por família</span>
          <div class="galeria-filtros" id="filtroSobrenome"></div>
        </div>
      </div>
      <div id="csRoot" style="margin-top:26px"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
function renderPeopleCarousel(list){
  const slides=list.map(p=>({
    src:p.avatar_path?avatarUrl(p.avatar_path):'', alt:p.full_name||'', title:p.full_name,
    nickname:p.nickname||'', description:yearsLabel(p), badge:surnameTokens(p)[0]||'',
    gender:p.gender, isLiving:p.is_living, personId:p.id
  }));
  initStackedCarousel($('#csRoot'),slides,{
    onCardClick:(s)=>{ if(s.personId) location.href=`pessoa.html?id=${s.personId}`; }
  });
}

function renderFiltroSobrenome(allPeople,sobrenomeAtivo){
  const todos=[...new Set(allPeople.flatMap(p=>surnameTokens(p)))].sort();
  $('#filtroSobrenome').innerHTML=['Tudo',...todos].map(f=>{
    const ativo=(f==='Tudo'&&!sobrenomeAtivo)||f===sobrenomeAtivo;
    const href=f==='Tudo'?'pessoas.html':`pessoas.html?sobrenome=${encodeURIComponent(f)}`;
    return `<a class="filtro-btn ${ativo?'active':''}" href="${href}">${escapeHtml(f)}</a>`;
  }).join('');
}

async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('#pageTitle'),{stagger:35});
  const {data:allPeople,error}=await sbClient.from('people').select('id,full_name,surname,nickname,birth_date,death_date,avatar_path,gender,is_living').order('full_name',{ascending:true});
  if(error||!allPeople||!allPeople.length){
    $('#peopleSummary').textContent='';
    $('#csRoot').innerHTML='<p class="empty-note">Nenhuma pessoa publicada ainda.</p>';
    return;
  }
  const sobrenome=new URLSearchParams(location.search).get('sobrenome');
  const people=sobrenome?allPeople.filter(p=>surnameTokens(p).includes(sobrenome)):allPeople;

  renderFiltroSobrenome(allPeople,sobrenome);
  if(!reduceMotion) revealBlock($('.pessoas-head-right'),100);

  if(sobrenome){
    $('#pageTitle').textContent=sobrenome;
    $('#peopleSummary').textContent=people.length+(people.length===1?' pessoa com esse sobrenome.':' pessoas com esse sobrenome.');
    $('#clearFilterRow').innerHTML='<a href="pessoas.html">← Ver todas as pessoas</a>';
  } else {
    $('#peopleSummary').textContent=people.length+(people.length===1?' pessoa documentada neste acervo.':' pessoas documentadas neste acervo.');
  }
  if(!reduceMotion) revealBlock($('#peopleSummary'),60);

  if(!people.length){
    $('#csRoot').innerHTML='<p class="empty-note">Ninguém encontrado com esse sobrenome.</p>';
    return;
  }
  renderPeopleCarousel(people);
}
boot();
</script>
</body>
</html>
