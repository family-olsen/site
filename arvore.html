<body>
<main id="main"><p class="empty-note" style="padding:60px 48px">Carregando…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
let currentFocusId=null, zoomScale=.85, panX=0, panY=0, ALL_PEOPLE_COUNT=0, siblingIndex=0, spouseIndex=0, siblingHidden=false, spouseHidden=false;
// primeira vez que alguém abre a árvore (sem nada salvo, sem link direto), começa centralizada
// no Everton — depois disso, sempre lembra da última pessoa que a pessoa visualizou por último.
const DEFAULT_FOCUS_ID='bf01bfa2-d67d-4462-985a-5e573e631a43';
const LAST_FOCUS_KEY='arvoreUltimoFoco';
function lembrarFoco(id){ try{ localStorage.setItem(LAST_FOCUS_KEY,id); }catch(e){} }
function lerUltimoFoco(){ try{ return localStorage.getItem(LAST_FOCUS_KEY); }catch(e){ return null; } }
function hideToggleBtn(kind){
  const label=kind==='sibling'?'irmão(ã)':'cônjuge';
  return `<button type="button" class="fam-hide-btn" data-hide="${kind}" title="Ocultar ${label}" aria-label="Ocultar ${label}">×</button>`;
}
function showToggleBtn(kind){
  const label=kind==='sibling'?'Irmão(ã)':'Cônjuge';
  return `<button type="button" class="fam-show-btn" data-show="${kind}">+ ${label}</button>`;
}

function applyTreeTransform(){
  const canvas=$('#treeCanvas'); if(!canvas) return;
  canvas.style.transform=`translate(${panX}px,${panY}px) scale(${zoomScale})`;
}
function setZoom(z){ zoomScale=Math.min(1.6,Math.max(.3,z)); applyTreeTransform(); }

async function loadTree(personId,opts={}){
  if(!opts.keepExpand){ expandedUp=new Set(); expandedDown=new Set(); expandedSide=new Set(); }
  if(!opts.keepPager){ siblingIndex=0; spouseIndex=0; siblingHidden=false; spouseHidden=false; }
  currentFocusId=personId;
  history.replaceState(null,'',`arvore.html?foco=${personId}`);
  const {data:focus}=await sbClient.from('people').select(PERSON_FIELDS).eq('id',personId).maybeSingle();
  if(!focus) return;
  lembrarFoco(personId);
  const [parents,children,spouses]=await Promise.all([fetchParents(personId),fetchChildren(personId),fetchSpouses(personId)]);
  const siblings=await fetchSiblings(parents.map(p=>p.id),personId);
  await renderPedigree(focus,parents,spouses,children,siblings);
}

async function renderPedigree(focus,parents,spouses,children,siblings){
  const [p0,p1]=parents;
  const [p0Branch,p1Branch]=await Promise.all([p0?buildAncestorBranch(p0):null,p1?buildAncestorBranch(p1):null]);

  // irmãos e cônjuges: mostra um de cada vez com setas ‹ › pra navegar quando há mais de um
  // (o botão de paginar sempre existe quando há pelo menos 1 — não depende de "caber" na tela)
  siblingIndex=Math.min(siblingIndex,Math.max(0,siblings.length-1));
  const sib=(!siblingHidden&&siblings.length)?siblings[siblingIndex]:null;
  const sibBranch=sib?await buildDescendantBranch(sib):null;
  spouseIndex=Math.min(spouseIndex,Math.max(0,spouses.length-1));
  const sp=(!spouseHidden&&spouses.length)?spouses[spouseIndex]:null;
  const spBranch=sp?(expandedUp.has(sp.id)?await buildAncestorBranch(sp):{person:sp,expanded:false,parents:null}):null;
  const childBranches=await Promise.all(children.map(c=>buildDescendantBranch(c)));

  // agora que já sabemos exatamente quem vai virar cartão nessa tela, confere numa passada só
  // quem realmente tem mais pai/mãe, filho ou cônjuge pra mostrar — só aí decide quais setinhas
  // desenhar. Sem isso, ficaria botão de expandir em pessoa que não tem mais nada (ex.: netos).
  const allIds=new Set();
  if(p0Branch) collectBranchIds(p0Branch,allIds);
  if(p1Branch) collectBranchIds(p1Branch,allIds);
  if(sibBranch) collectBranchIds(sibBranch,allIds);
  if(spBranch) collectBranchIds(spBranch,allIds);
  childBranches.forEach(cb=>collectBranchIds(cb,allIds));
  const rel=await fetchHasRelations([...allIds]);
  hasParentsSet=rel.parents; hasChildrenSet=rel.children; hasSpousesSet=rel.spouses;

  const parentsRow=`<div class="fam-row" id="famParentsRow">
    ${p0Branch?`<div class="fam-branch fam-branch-anc">${renderAncestorBranchHtml(p0Branch,focus.id)}</div>`:''}
    ${p1Branch?`<div class="fam-branch fam-branch-anc">${renderAncestorBranchHtml(p1Branch,focus.id)}</div>`:''}
  </div>`;
  let siblingHtml='';
  if(siblings.length&&siblingHidden){
    siblingHtml=showToggleBtn('sibling');
  } else if(sibBranch){
    siblingHtml=famPagerHtml('sibling',siblingIndex,siblings.length,`<div class="fam-branch">${renderDescendantBranchHtml(sibBranch,focus.id,{blood:true})}</div>`,false,hideToggleBtn('sibling'));
  }
  let spouseHtml='';
  if(spouses.length&&spouseHidden){
    spouseHtml=showToggleBtn('spouse');
  } else if(spBranch){
    spouseHtml=famPagerHtml('spouse',spouseIndex,spouses.length,`<div class="fam-branch">${renderSpouseBranchHtml(spBranch,focus.id)}</div>`,true,hideToggleBtn('spouse'));
  }
  const midRow=`<div class="fam-row" id="famMidRow">${siblingHtml}${famCard(focus,focus.id)}${spouseHtml}</div>`;
  const childrenRow=`<div class="fam-row" id="famChildrenRow">${childBranches.map(cb=>`<div class="fam-branch">${renderDescendantBranchHtml(cb,focus.id)}</div>`).join('')}</div>`;

  $('#treeView').innerHTML=`<svg class="ped-lines" id="pedLines"></svg><div class="fam-tree">${parentsRow}${midRow}${childrenRow}</div>`;
  $('#focoNome').textContent=focus.full_name;
  $('#verPerfilLink').href=`pessoa.html?id=${focus.id}`;

  document.querySelectorAll('[data-focus]').forEach(el=>{
    if(el.dataset.focus===focus.id) return;
    el.addEventListener('click',()=>loadTree(el.dataset.focus));
  });
  document.querySelectorAll('[data-expand]').forEach(el=>{
    el.addEventListener('click',()=>{
      const set=el.dataset.expand==='up'?expandedUp:expandedDown;
      if(set.has(el.dataset.person)) set.delete(el.dataset.person); else set.add(el.dataset.person);
      loadTree(currentFocusId,{keepExpand:true,keepPager:true});
    });
  });
  document.querySelectorAll('[data-expand-side]').forEach(el=>{
    el.addEventListener('click',()=>{
      const pid=el.dataset.expandSide;
      if(expandedSide.has(pid)) expandedSide.delete(pid); else expandedSide.add(pid);
      loadTree(currentFocusId,{keepExpand:true,keepPager:true});
    });
  });
  document.querySelectorAll('[data-hide]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.hide==='sibling') siblingHidden=true; else spouseHidden=true;
      loadTree(currentFocusId,{keepExpand:true,keepPager:true});
    });
  });
  document.querySelectorAll('[data-show]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.show==='sibling') siblingHidden=false; else spouseHidden=false;
      loadTree(currentFocusId,{keepExpand:true,keepPager:true});
    });
  });
  document.querySelectorAll('[data-pager]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.disabled) return;
      const dir=Number(el.dataset.dir);
      if(el.dataset.pager==='sibling') siblingIndex=Math.max(0,siblingIndex+dir); else spouseIndex=Math.max(0,spouseIndex+dir);
      loadTree(currentFocusId,{keepExpand:true,keepPager:true});
    });
  });
  requestAnimationFrame(()=>drawPedLines(zoomScale));
  // recalcula as linhas quando as fotos terminarem de carregar (evita linhas desalinhadas por causa da mudança de altura do cartão)
  document.querySelectorAll('#treeView img').forEach(img=>{
    if(!img.complete) img.addEventListener('load',()=>drawPedLines(zoomScale));
  });
}

async function boot(){
  renderHeader(); renderFooter();
  const {data:anyPerson,count}=await sbClient.from('people').select('id',{count:'exact'}).limit(1);
  ALL_PEOPLE_COUNT=count||0;
  if(!anyPerson||!anyPerson.length){
    $('#main').innerHTML='<div class="empty-state-public"><h3>Nenhuma pessoa publicada ainda</h3></div>';
    return;
  }
  const focoParam=new URLSearchParams(location.search).get('foco');
  // prioridade: link direto (?foco=) > última pessoa vista nessa árvore (localStorage) >
  // Everton (padrão só na primeiríssima vez, sem nada salvo ainda).
  let startId=focoParam||lerUltimoFoco()||DEFAULT_FOCUS_ID;
  const {data:startExiste}=await sbClient.from('people').select('id').eq('id',startId).maybeSingle();
  if(!startExiste) startId=anyPerson[0].id; // id salvo/padrão não existe mais — evita árvore vazia

  $('#main').innerHTML=`
    <div class="tree-main">
      <div class="tree-head">
        <div><h1>Árvore genealógica</h1><p>${ALL_PEOPLE_COUNT} pessoas documentadas.</p></div>
        <a class="tree-view-link" id="verPerfilLink" href="#">Ver perfil de <span id="focoNome">—</span> →</a>
        <div style="display:flex;gap:8px">
          <button type="button" class="tree-zoom-btn" id="zoomOutBtn" aria-label="Diminuir zoom">−</button>
          <button type="button" class="tree-zoom-btn" id="zoomResetBtn" aria-label="Redefinir zoom">⊙</button>
          <button type="button" class="tree-zoom-btn" id="zoomInBtn" aria-label="Aumentar zoom">+</button>
          <button type="button" class="tree-zoom-btn" id="maximizeBtn" aria-label="Expandir para tela cheia" title="Expandir para tela cheia">⛶</button>
        </div>
      </div>
      <div class="tree-viewport" id="treeViewport">
        <div class="tree-canvas" id="treeCanvas"><div id="treeView"></div></div>
      </div>
    </div>`;
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) revealWords($('.tree-head h1'),{stagger:35});

  $('#zoomInBtn').addEventListener('click',()=>setZoom(zoomScale+.15));
  $('#zoomOutBtn').addEventListener('click',()=>setZoom(zoomScale-.15));
  $('#zoomResetBtn').addEventListener('click',()=>{zoomScale=.85; panX=0; panY=0; applyTreeTransform();});
  $('#maximizeBtn').addEventListener('click',toggleMaximize);

  const vp=$('#treeViewport');
  vp.addEventListener('mousedown',(e)=>{
    const ox=e.clientX, oy=e.clientY, sx=panX, sy=panY;
    vp.classList.add('panning');
    const move=(ev)=>{ panX=sx+(ev.clientX-ox); panY=sy+(ev.clientY-oy); applyTreeTransform(); };
    const up=()=>{ vp.classList.remove('panning'); window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  });
  // roda do mouse = zoom (sem precisar segurar Ctrl)
  vp.addEventListener('wheel',(e)=>{
    e.preventDefault();
    setZoom(zoomScale+(e.deltaY<0?.08:-.08));
  },{passive:false});

  sizeTreeMain();
  window.addEventListener('resize',()=>{ sizeTreeMain(); drawPedLines(zoomScale); });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&isMaximized) toggleMaximize(); });

  applyTreeTransform();
  await loadTree(startId);
}
let isMaximized=false;
function toggleMaximize(){
  isMaximized=!isMaximized;
  const treeMain=$('.tree-main'), btn=$('#maximizeBtn');
  treeMain.classList.toggle('maximized',isMaximized);
  document.body.classList.toggle('tree-locked',isMaximized);
  if(btn){ btn.textContent=isMaximized?'✕':'⛶'; btn.title=isMaximized?'Sair da tela cheia':'Expandir para tela cheia'; btn.setAttribute('aria-label',btn.title); }
  sizeTreeMain();
  requestAnimationFrame(()=>drawPedLines(zoomScale));
}
function sizeTreeMain(){
  const header=document.querySelector('.site-header');
  const treeMain=$('.tree-main');
  if(!treeMain) return;
  if(isMaximized){ treeMain.style.height='100vh'; return; }
  if(header) treeMain.style.height=`calc(100vh - ${header.offsetHeight}px)`;
}
boot();
</script>
