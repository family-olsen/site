<body>
<main>
  <div class="section" style="padding-bottom:110px">
    <div class="wrap-narrow">
      <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,64px);margin:0 0 14px;letter-spacing:-.02em">Linha do tempo</h1>
      <p style="font-size:15px;line-height:1.7;color:var(--muted-2);max-width:560px;margin:0 0 clamp(30px,5vw,60px)" id="summary">Carregando…</p>
      <div class="timeline" id="timelineList"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
const TYPE_LABEL={birth:'nascimento',marriage:'casamento',death:'falecimento',baptism:'batismo',immigration:'imigração',other:'evento'};
async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('main h1'),{stagger:35});
  const {data:events}=await sbClient.from('events').select('id,title,description,event_type,event_date,start_date,event_people(person_id)').order('event_date',{ascending:true,nullsFirst:false}).order('start_date',{ascending:true,nullsFirst:false});
  if(!events||!events.length){
    $('#summary').textContent='';
    $('#timelineList').innerHTML='<p class="empty-note">Nenhum evento publicado ainda.</p>';
    return;
  }
  $('#summary').textContent=`${events.length} ${events.length===1?'marco documentado':'marcos documentados'}, do mais antigo ao mais recente.`;
  if(!reduceMotion) revealBlock($('#summary'));
  $('#timelineList').innerHTML=`<span class="timeline-rule"></span>`+events.map(e=>{
    const ano=(e.event_date||e.start_date||'').slice(0,4)||'—';
    const subjectId=e.event_people?.[0]?.person_id;
    const href=subjectId?`pessoa.html?id=${subjectId}`:'#';
    return `<a class="timeline-item" href="${href}">
      <span class="timeline-dot"></span>
      <span class="timeline-ano">${escapeHtml(ano)}</span>
      <span><span class="timeline-titulo">${escapeHtml(e.title)}</span><span class="timeline-texto">${escapeHtml(e.description||'')}</span><span class="timeline-tipo">${escapeHtml(TYPE_LABEL[e.event_type]||e.event_type||'')}</span></span>
    </a>`;
  }).join('');
}
boot();
</script>
</body>
</html>
