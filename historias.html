<style>
  .story-row{display:grid;grid-template-columns:220px 1fr;gap:26px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:26px 0;cursor:pointer;color:inherit;font-family:inherit;transition:background .3s}
  .story-row:hover{background:rgba(237,231,220,.04)}
  .story-row .thumb{height:140px;border-radius:14px;background:var(--bg-3);background-size:cover;background-position:center;filter:saturate(.6) brightness(.85)}
  /* no mobile a coluna fixa de 220px sobrava quase a tela toda e espremia o texto
     numa faixa estreitíssima (título/resumo quebrando em várias linhas curtas) —
     aqui a foto vira uma faixa larga em cima, texto embaixo ocupando a largura toda. */
  @media (max-width:600px){
    .story-row{grid-template-columns:1fr;gap:14px}
    .story-row .thumb{height:52vw;max-height:220px}
  }
  /* cabeçalho da página com filtros no canto superior direito — mesmo padrão de
     Fotos e Pessoas: selects lado a lado, rótulo alinhado à direita logo acima. */
  .historias-head{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(20px,4vw,48px);flex-wrap:wrap}
  .historias-head-left{flex:1 1 260px;min-width:0}
  .historias-head-right{flex:0 1 auto;min-width:0;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .historias-head-right .rotulo{text-align:right}
</style>

<body>
<main>
  <div class="section-tight" style="padding-top:clamp(10px,1.5vw,20px)">
    <div class="wrap">
      <div class="historias-head">
        <div class="historias-head-left">
          <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,64px);margin:0 0 14px;letter-spacing:-.02em">Histórias</h1>
          <p style="font-size:15px;line-height:1.7;color:var(--muted-2);max-width:560px;margin:0" id="summary">Carregando…</p>
        </div>
        <div class="historias-head-right" id="filtrosWrap"></div>
      </div>
      <div id="list" style="margin-top:26px"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
let ALL_STORIES=[], filtroPessoa='Tudo', filtroFamilia='Tudo', filtroTitulo='Tudo';
let HAS_FAMILIAS=false, HAS_PESSOAS=false, HAS_TITULOS=false;

// Listas grandes (dezenas de famílias ou pessoas) ficam melhor num campo que
// deixa digitar pra buscar, mas ainda escolhe de uma lista — <input list>.
function buscaGrupoHtml(rotulo,items,valorAtual,grupo,placeholder){
  return `<div class="filtros-grupo"><label class="rotulo" for="filtro-${grupo}">${escapeHtml(rotulo)}</label>
    <input class="busca-filtro" id="filtro-${grupo}" list="filtro-${grupo}-list" data-grupo="${grupo}" autocomplete="off" placeholder="${escapeHtml(placeholder||'Todas')}" value="${valorAtual==='Tudo'?'':escapeHtml(valorAtual)}">
    <datalist id="filtro-${grupo}-list">${items.map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>
  </div>`;
}

// Opções de um campo, recalculadas a partir do OUTRO filtro já aplicado (sem
// considerar o próprio campo) — assim um filtro vai "segregando" o outro.
function opcoesPara(campo){
  const subset=ALL_STORIES.filter(s=>
    (campo==='familia'||filtroFamilia==='Tudo'||s.familias.includes(filtroFamilia)) &&
    (campo==='pessoa'||filtroPessoa==='Tudo'||s.pessoas.includes(filtroPessoa)) &&
    (campo==='titulo'||filtroTitulo==='Tudo'||s.title===filtroTitulo)
  );
  if(campo==='familia') return [...new Set(subset.flatMap(s=>s.familias))].sort();
  if(campo==='pessoa') return [...new Set(subset.flatMap(s=>s.pessoas))].sort();
  return [...new Set(subset.map(s=>s.title).filter(Boolean))].sort();
}

function renderFiltros(){
  const parts=[];
  if(HAS_TITULOS) parts.push(buscaGrupoHtml('Título',opcoesPara('titulo'),filtroTitulo,'titulo','Todos'));
  if(HAS_FAMILIAS) parts.push(buscaGrupoHtml('Filtrar por família',opcoesPara('familia'),filtroFamilia,'familia'));
  if(HAS_PESSOAS) parts.push(buscaGrupoHtml('Pessoa',opcoesPara('pessoa'),filtroPessoa,'pessoa'));
  parts.push('<button type="button" class="btn-limpar-filtros" id="btnLimparFiltros">Limpar filtros</button>');
  $('#filtrosWrap').innerHTML=parts.join('');

  document.querySelectorAll('.busca-filtro').forEach(inp=>{
    const grupo=inp.dataset.grupo, itens=opcoesPara(grupo);
    inp.addEventListener('change',()=>{
      const v=inp.value.trim();
      const valorValido=v===''||itens.includes(v);
      const novo=valorValido&&v!==''?v:'Tudo';
      if(grupo==='familia') filtroFamilia=novo;
      else if(grupo==='pessoa') filtroPessoa=novo;
      else filtroTitulo=novo;
      renderFiltros(); renderList();
    });
  });

  $('#btnLimparFiltros').addEventListener('click',()=>{
    filtroFamilia='Tudo'; filtroPessoa='Tudo'; filtroTitulo='Tudo';
    renderFiltros(); renderList();
  });
}

function filteredStories(){
  return ALL_STORIES.filter(s=>
    (filtroPessoa==='Tudo'||s.pessoas.includes(filtroPessoa)) &&
    (filtroFamilia==='Tudo'||s.familias.includes(filtroFamilia)) &&
    (filtroTitulo==='Tudo'||s.title===filtroTitulo)
  );
}

function renderList(){
  const lista=filteredStories();
  if(!lista.length){ $('#list').innerHTML='<p class="empty-note">Nenhuma história encontrada com esse filtro.</p>'; return; }
  $('#list').innerHTML=lista.map(s=>{
    const thumb=s.story_photos?.find(sp=>sp.photos?.thumbnail_path)?.photos?.thumbnail_path;
    return `<a class="story-row" href="historia.html?slug=${s.slug||s.id}">
      <span class="thumb" style="${thumb?`background-image:url('${photoUrl(thumb)}')`:''}"></span>
      <span><span class="list-title" style="font-size:26px">${escapeHtml(s.title)}</span><span class="list-resumo">${escapeHtml(s.summary||'')}</span></span>
    </a>`;
  }).join('');
}

async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('main h1'),{stagger:35});
  const {data:stories}=await sbClient.from('stories').select('id,slug,title,summary,story_photos(photos(thumbnail_path)),story_people(people(id,full_name,surname))').order('updated_at',{ascending:false});
  ALL_STORIES=(stories||[]).map(s=>({
    ...s,
    pessoas:(s.story_people||[]).map(sp=>sp.people?.full_name).filter(Boolean),
    familias:[...new Set((s.story_people||[]).flatMap(sp=>sp.people?surnameTokens(sp.people):[]))]
  }));
  if(!ALL_STORIES.length){ $('#summary').textContent=''; $('#list').innerHTML='<p class="empty-note">Nenhuma história publicada ainda.</p>'; revealBlock($('#list')); return; }
  $('#summary').textContent=`${ALL_STORIES.length} ${ALL_STORIES.length===1?'relato guardado':'relatos guardados'} neste acervo.`;

  HAS_FAMILIAS=ALL_STORIES.some(s=>s.familias.length);
  HAS_PESSOAS=ALL_STORIES.some(s=>s.pessoas.length);
  HAS_TITULOS=ALL_STORIES.some(s=>s.title);
  renderFiltros();
  renderList();

  if(!reduceMotion){
    revealBlock($('#summary'));
    revealBlock($('#filtrosWrap'),100);
    revealBlock($('#list'),120);
  }
}
boot();
</script>
</body>
</html>
