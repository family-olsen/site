name: Backup do banco de dados

# Faz um dump completo do banco (schema + dados) uma vez por mes e
# envia pro Google Drive da familia -- NAO commita no repo, porque
# este repositorio e publico e o dump inclui gente marcada como
# privada/nao publicada, que a RLS do site nunca mostraria.
#
# Precisa de dois secrets configurados no repo (Settings > Secrets and
# variables > Actions):
#   DATABASE_URL  - connection string do Supabase (Project Settings >
#                   Database > Connection string > Session pooler).
#   GDRIVE_SA_KEY - conteudo inteiro do arquivo .json da conta de
#                   servico do Google Cloud (legado-digital-backups),
#                   que tem acesso de Editor na pasta "Backups do
#                   Site" do Google Drive.
on:
  schedule:
    - cron: '0 13 1 * *' # dia 1 de cada mes, 13h UTC (10h de Brasilia)
  workflow_dispatch: {} # tambem da pra rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Rodar o dump do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          FILENAME="backup/olsenbellotoleal-$(date +%Y-%m-%d).sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$FILENAME"
          echo "Backup gerado: $FILENAME ($(du -h "$FILENAME" | cut -f1))"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Configurar acesso ao Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_KEY" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf <<'EOF'
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = 1WPZ-TJVVoE8mSViD_2ZiO016P7TaGiof
          EOF

      - name: Enviar backup pro Google Drive
        run: |
          rclone copy "$BACKUP_FILE" gdrive: -v

      - name: Limpar a chave temporaria
        if: always()
        run: rm -f /tmp/gdrive-sa.json
