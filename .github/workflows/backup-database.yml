name: Backup do banco de dados e do Storage

# Faz um dump completo do banco (schema + dados) e baixa tudo dos
# buckets de Storage (fotos e documentos), uma vez por mes, e envia
# pro Google Drive da familia -- NAO commita no repo, porque este
# repositorio e publico e o dump inclui gente marcada como
# privada/nao publicada, que a RLS do site nunca mostraria.
#
# Autentica no Drive como o usuario de verdade (olsen.leal.belloto),
# nao uma conta de servico -- contas de servico nao tem cota de
# armazenamento propria em contas Google pessoais (sem Workspace),
# entao nao conseguem criar arquivo nem em pasta compartilhada como
# Editor. Autorizado uma vez via `rclone authorize`.
#
# Precisa de quatro secrets configurados no repo (Settings > Secrets
# and variables > Actions):
#   DATABASE_URL         - connection string do Supabase (Project
#                           Settings > Database > Connection string >
#                           Session pooler).
#   GDRIVE_CLIENT_ID      - ID do cliente OAuth (Google Cloud Console >
#                           APIs e servicos > Credenciais).
#   GDRIVE_CLIENT_SECRET  - chave secreta desse mesmo cliente OAuth.
#   GDRIVE_TOKEN          - token gerado rodando localmente:
#                           rclone authorize "drive" "<client_id>" "<client_secret>"
on:
  schedule:
    - cron: '0 13 1 * *' # dia 1 de cada mes, 13h UTC (10h de Brasilia)
  workflow_dispatch: {} # tambem da pra rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres
        # O pacote padrao do Ubuntu instala o cliente 16, mas o Supabase
        # roda Postgres 17 -- pg_dump recusa rodar contra um servidor
        # mais novo que ele mesmo. Usa o repositorio oficial do
        # PostgreSQL (PGDG) pra instalar a versao 17 certinha.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Rodar o dump do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          FILENAME="backup/olsenbellotoleal-$(date +%Y-%m-%d).sql.gz"
          # Caminho explicito do binario -- o "pg_dump" generico do PATH
          # continua apontando pro 16 que a imagem do runner ja trazia.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$FILENAME"
          SIZE=$(stat -c%s "$FILENAME")
          if [ "$SIZE" -lt 1000 ]; then
            echo "Backup suspeito demais pequeno ($SIZE bytes) -- alguma coisa deu errado."
            exit 1
          fi
          echo "Backup gerado: $FILENAME ($(du -h "$FILENAME" | cut -f1))"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Baixar fotos e documentos do Storage
        # Os buckets "photos" e "documents" sao publicos (o site
        # precisa deles pra mostrar as imagens), entao a chave
        # publishable ja basta pra listar e baixar tudo -- nao precisa
        # de secret novo nenhum.
        env:
          SUPABASE_URL: https://igglfuatavmxabffaflb.supabase.co
          SUPABASE_KEY: sb_publishable_Kj1x2hJwqDpmTtni-6SxVg_qxKGOIze
        run: |
          set -euo pipefail
          mkdir -p storage_backup

          list_and_download() {
            local bucket="$1" prefix="$2" dest="$3"
            local response
            response=$(curl -sS -X POST "$SUPABASE_URL/storage/v1/object/list/$bucket" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"prefix\":\"$prefix\",\"limit\":1000,\"sortBy\":{\"column\":\"name\",\"order\":\"asc\"}}")
            echo "$response" | jq -c '.[]' | while read -r item; do
              name=$(echo "$item" | jq -r '.name')
              id=$(echo "$item" | jq -r '.id')
              if [ "$id" = "null" ]; then
                list_and_download "$bucket" "${prefix}${name}/" "$dest"
              else
                mkdir -p "$dest/$(dirname "${prefix}${name}")"
                curl -sS -o "$dest/${prefix}${name}" "$SUPABASE_URL/storage/v1/object/public/$bucket/${prefix}${name}"
              fi
            done
          }

          list_and_download "photos" "" "storage_backup/photos"
          list_and_download "documents" "" "storage_backup/documents"
          echo "Baixados: $(find storage_backup -type f | wc -l) arquivos ($(du -sh storage_backup | cut -f1))"

      - name: Configurar acesso ao Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          {
            echo "[gdrive]"
            echo "type = drive"
            echo "scope = drive"
            echo "client_id = $GDRIVE_CLIENT_ID"
            echo "client_secret = $GDRIVE_CLIENT_SECRET"
            echo "token = $GDRIVE_TOKEN"
            echo "root_folder_id = 1WPZ-TJVVoE8mSViD_2ZiO016P7TaGiof"
          } > ~/.config/rclone/rclone.conf

      - name: Enviar backups pro Google Drive
        run: |
          rclone copy "$BACKUP_FILE" gdrive: -v
          rclone copy storage_backup/photos gdrive:fotos-e-documentos/photos -v
          rclone copy storage_backup/documents gdrive:fotos-e-documentos/documents -v
