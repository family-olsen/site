  .galeria-head{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(20px,4vw,48px);flex-wrap:wrap}

<body>
<main>
  <div class="section-tight" style="padding-bottom:90px;padding-top:clamp(20px,3vw,40px)">
    <div class="wrap">
      <div class="galeria-head">
        <div class="galeria-head-left">
          <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(30px,5vw,54px);margin:0 0 12px;letter-spacing:-.02em">Arquivo de fotos</h1>
          <p style="font-size:15px;line-height:1.7;color:var(--muted-2);margin:0" id="gallerySummary">Carregando…</p>
        </div>
        <div class="galeria-head-right" id="filtrosWrap"></div>
      </div>
      <div id="cfRoot" style="margin-top:26px"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
let ALL_PHOTOS=[], filtroDecada='Tudo', filtroColecao='Tudo', filtroFamilia='Tudo', filtroPessoa='Tudo';
let HAS_COLECOES=false, HAS_FAMILIAS=false, HAS_PESSOAS=false;

function openPhotoLightbox(p){
  const local=p.places?.name||'';
  const meta=[p.photo_date?p.photo_date.slice(0,4):'',local].filter(Boolean).join(' · ');
  openLightbox(photoUrl(p.optimized_path||p.thumbnail_path),p.title,meta+(p.caption?(meta?' — ':'')+p.caption:''),p.description,p.pessoasLink);
}

function filteredPhotos(){
  return ALL_PHOTOS.filter(p=>
    (filtroDecada==='Tudo'||p.decada===filtroDecada) &&
    (filtroColecao==='Tudo'||p.colecoes.includes(filtroColecao)) &&
    (filtroFamilia==='Tudo'||p.familias.includes(filtroFamilia)) &&
    (filtroPessoa==='Tudo'||p.pessoas.includes(filtroPessoa))
  );
}

function renderCarousel(startId){
  const list=filteredPhotos();
  if(!list.length){ $('#cfRoot').innerHTML='<p class="empty-note">Nenhuma foto nesse filtro ainda.</p>'; return; }
  const slides=list.map(p=>({
    src:photoUrl(p.thumbnail_path),
    alt:p.title||'',
    title:p.title,
    subtitle:[p.photo_date?p.photo_date.slice(0,4):'',p.places?.name||''].filter(Boolean).join(' · '),
    legenda:p.caption||''
  }));
  const startIndex=Math.max(0,list.findIndex(p=>p.id===startId));
  initCoverflow($('#cfRoot'),slides,{
    startIndex,
    onCardClick:(_,i)=>openPhotoLightbox(list[i])
  });
}

function filtroGrupoHtml(rotulo,items,valorAtual,grupo){
  return `<div class="filtros-grupo"><label class="rotulo" for="filtro-${grupo}">${escapeHtml(rotulo)}</label>
    <select class="select-filtro" id="filtro-${grupo}" data-grupo="${grupo}">
      ${['Tudo',...items].map(f=>`<option value="${escapeHtml(f)}" ${f===valorAtual?'selected':''}>${escapeHtml(f)}</option>`).join('')}
    </select>
  </div>`;
}

// Listas grandes (dezenas de famílias ou pessoas) ficam melhor num campo que
// deixa digitar pra buscar, mas ainda escolhe de uma lista — <input list>.
function buscaGrupoHtml(rotulo,items,valorAtual,grupo){
  return `<div class="filtros-grupo"><label class="rotulo" for="filtro-${grupo}">${escapeHtml(rotulo)}</label>
    <input class="busca-filtro" id="filtro-${grupo}" list="filtro-${grupo}-list" data-grupo="${grupo}" autocomplete="off" placeholder="Todas" value="${valorAtual==='Tudo'?'':escapeHtml(valorAtual)}">
    <datalist id="filtro-${grupo}-list">${items.map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>
  </div>`;
}

// Opções de um campo, recalculadas a partir dos OUTROS filtros já aplicados
// (sem considerar o próprio campo) — assim um filtro vai "segregando" o outro.
function opcoesPara(campo){
  const subset=ALL_PHOTOS.filter(p=>
    (campo==='decada'||filtroDecada==='Tudo'||p.decada===filtroDecada) &&
    (campo==='colecao'||filtroColecao==='Tudo'||p.colecoes.includes(filtroColecao)) &&
    (campo==='familia'||filtroFamilia==='Tudo'||p.familias.includes(filtroFamilia)) &&
    (campo==='pessoa'||filtroPessoa==='Tudo'||p.pessoas.includes(filtroPessoa))
  );
  if(campo==='decada') return [...new Set(subset.map(p=>p.decada))].sort();
  if(campo==='colecao') return [...new Set(subset.flatMap(p=>p.colecoes))].sort();
  if(campo==='familia') return [...new Set(subset.flatMap(p=>p.familias))].sort();
  return [...new Set(subset.flatMap(p=>p.pessoas))].sort();
}

function renderFiltros(){
  const parts=[filtroGrupoHtml('Década',opcoesPara('decada'),filtroDecada,'decada')];
  if(HAS_COLECOES) parts.push(filtroGrupoHtml('Coleção',opcoesPara('colecao'),filtroColecao,'colecao'));
  if(HAS_FAMILIAS) parts.push(buscaGrupoHtml('Família',opcoesPara('familia'),filtroFamilia,'familia'));
  if(HAS_PESSOAS) parts.push(buscaGrupoHtml('Pessoa',opcoesPara('pessoa'),filtroPessoa,'pessoa'));
  parts.push('<button type="button" class="btn-limpar-filtros" id="btnLimparFiltros">Limpar filtros</button>');
  $('#filtrosWrap').innerHTML=parts.join('');

  document.querySelectorAll('.select-filtro').forEach(sel=>sel.addEventListener('change',()=>{
    if(sel.dataset.grupo==='decada') filtroDecada=sel.value; else filtroColecao=sel.value;
    renderFiltros(); renderCarousel();
  }));

  document.querySelectorAll('.busca-filtro').forEach(inp=>{
    const grupo=inp.dataset.grupo, itens=opcoesPara(grupo);
    inp.addEventListener('change',()=>{
      const v=inp.value.trim();
      const valorValido=v===''||itens.includes(v);
      if(grupo==='familia') filtroFamilia=valorValido&&v!==''?v:'Tudo';
      else filtroPessoa=valorValido&&v!==''?v:'Tudo';
      renderFiltros(); renderCarousel();
    });
  });

  $('#btnLimparFiltros').addEventListener('click',()=>{
    filtroDecada='Tudo'; filtroColecao='Tudo'; filtroFamilia='Tudo'; filtroPessoa='Tudo';
    renderFiltros(); renderCarousel();
  });
}

async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('main h1'),{stagger:35});
  const {data:photos}=await sbClient.from('photos').select('id,title,caption,description,thumbnail_path,optimized_path,photo_date,places(name),album_photos(albums(title)),photo_people(people(id,full_name,surname,avatar_path))').eq('hide_from_gallery',false).order('photo_date',{ascending:false,nullsFirst:false});
  if(!photos||!photos.length){
    $('#gallerySummary').textContent='';
    $('#cfRoot').innerHTML='<p class="empty-note">Nenhuma foto publicada ainda.</p>';
    return;
  }
  ALL_PHOTOS=photos.map(p=>({
    ...p,
    decada:p.photo_date?(Math.floor(Number(p.photo_date.slice(0,4))/10)*10)+'s':'Sem data',
    colecoes:(p.album_photos||[]).map(ap=>ap.albums?.title).filter(Boolean),
    pessoas:(p.photo_people||[]).map(pp=>pp.people?.full_name).filter(Boolean),
    pessoasLink:(p.photo_people||[]).map(pp=>pp.people).filter(Boolean),
    familias:[...new Set((p.photo_people||[]).flatMap(pp=>pp.people?surnameTokens(pp.people):[]))]
  }));
  $('#gallerySummary').textContent=`${photos.length} ${photos.length===1?'imagem digitalizada':'imagens digitalizadas'} neste acervo.`;
  HAS_COLECOES=ALL_PHOTOS.some(p=>p.colecoes.length);
  HAS_FAMILIAS=ALL_PHOTOS.some(p=>p.familias.length);
  HAS_PESSOAS=ALL_PHOTOS.some(p=>p.pessoas.length);
  renderFiltros();
  if(!reduceMotion){ revealBlock($('#gallerySummary')); revealBlock($('#filtrosWrap'),100); }

  const focoFoto=new URLSearchParams(location.search).get('foto');
  renderCarousel(focoFoto);
  if(focoFoto){
    const p=ALL_PHOTOS.find(x=>x.id===focoFoto);
    if(p) openPhotoLightbox(p);
  }
}
boot();
</script>
</body>
</html>
