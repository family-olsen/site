<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotos — Olsen · Belloto · Leal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main>
  <div class="section" style="padding-bottom:90px">
    <div class="wrap">
      <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,64px);margin:0 0 14px;letter-spacing:-.02em">Arquivo de fotos</h1>
      <p style="font-size:15px;line-height:1.7;color:var(--muted-2);max-width:560px;margin:0 0 34px" id="gallerySummary">Carregando…</p>
      <div class="galeria-filtros" id="filtrosRow"></div>
      <div class="masonry" id="masonryGrid"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
let ALL_PHOTOS=[], filtro='Tudo';
function renderGrid(){
  const list=filtro==='Tudo'?ALL_PHOTOS:ALL_PHOTOS.filter(p=>p.decada===filtro);
  $('#masonryGrid').innerHTML=list.length?list.map(p=>`
    <div class="masonry-item">
      <button type="button" class="photo-card" data-id="${p.id}" style="height:${p.altura}px">
        <span class="img" style="background-image:url('${photoUrl(p.thumbnail_path)}')"></span>
        <span class="photo-caption"><span class="alt">${escapeHtml(p.title||'')}</span><span class="ano">${escapeHtml(p.photo_date?p.photo_date.slice(0,4):'')}</span></span>
      </button>
    </div>`).join(''):'<p class="empty-note">Nenhuma foto nesse filtro ainda.</p>';
  document.querySelectorAll('.photo-card').forEach(b=>b.addEventListener('click',()=>{
    const p=ALL_PHOTOS.find(x=>x.id===b.dataset.id);
    openLightbox(photoUrl(p.optimized_path||p.thumbnail_path),p.title,(p.photo_date?p.photo_date.slice(0,4)+' · ':'')+(p.caption||''));
  }));
}
function renderFiltros(decadas){
  const items=['Tudo',...decadas];
  $('#filtrosRow').innerHTML=items.map(f=>`<button type="button" class="filtro-btn ${f===filtro?'active':''}" data-f="${f}">${escapeHtml(f)}</button>`).join('');
  document.querySelectorAll('.filtro-btn').forEach(b=>b.addEventListener('click',()=>{filtro=b.dataset.f; renderFiltros(decadas); renderGrid();}));
}

async function boot(){
  renderHeader(); renderFooter();
  const {data:photos}=await sbClient.from('photos').select('id,title,caption,thumbnail_path,optimized_path,photo_date').order('photo_date',{ascending:false,nullsFirst:false});
  if(!photos||!photos.length){
    $('#gallerySummary').textContent='';
    $('#masonryGrid').innerHTML='<p class="empty-note">Nenhuma foto publicada ainda.</p>';
    return;
  }
  const alturas=[330,200,180,420,260,300];
  ALL_PHOTOS=photos.map((p,i)=>({...p,altura:alturas[i%alturas.length],decada:p.photo_date?(Math.floor(Number(p.photo_date.slice(0,4))/10)*10)+'s':'Sem data'}));
  $('#gallerySummary').textContent=`${photos.length} ${photos.length===1?'imagem digitalizada':'imagens digitalizadas'} neste acervo.`;
  const decadas=[...new Set(ALL_PHOTOS.map(p=>p.decada))].sort();
  renderFiltros(decadas);
  renderGrid();

  const focoFoto=new URLSearchParams(location.search).get('foto');
  if(focoFoto){
    const p=ALL_PHOTOS.find(x=>x.id===focoFoto);
    if(p) openLightbox(photoUrl(p.optimized_path||p.thumbnail_path),p.title,(p.photo_date?p.photo_date.slice(0,4)+' · ':'')+(p.caption||''));
  }
}
boot();
</script>
</body>
</html>
