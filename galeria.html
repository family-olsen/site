<link rel="stylesheet" href="css/site.css">
<style>
  .galeria-head{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(20px,4vw,48px);flex-wrap:wrap}
  .galeria-head-left{flex:1 1 260px;min-width:0}
  .galeria-head-right{flex:0 1 auto;min-width:0;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .filtros-grupo{min-width:0}
  .filtros-grupo .rotulo{display:block;font-size:var(--fs-micro);letter-spacing:.18em;text-transform:uppercase;color:var(--muted-4);margin-bottom:8px;text-align:right}
</style>

<body>
<main>
  <div class="section-tight" style="padding-bottom:90px;padding-top:clamp(20px,3vw,40px)">
    <div class="wrap">
      <div class="galeria-head">
        <div class="galeria-head-left">
          <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(30px,5vw,54px);margin:0 0 12px;letter-spacing:-.02em">Arquivo de fotos</h1>
          <p style="font-size:15px;line-height:1.7;color:var(--muted-2);margin:0" id="gallerySummary">Carregando…</p>
        </div>
        <div class="galeria-head-right" id="filtrosWrap"></div>
      </div>
      <div id="cfRoot" style="margin-top:26px"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
let ALL_PHOTOS=[], filtroDecada='Tudo', filtroColecao='Tudo', filtroFamilia='Tudo', filtroPessoa='Tudo';

function openPhotoLightbox(p){
  const local=p.places?.name||'';
  const meta=[p.photo_date?p.photo_date.slice(0,4):'',local].filter(Boolean).join(' · ');
  openLightbox(photoUrl(p.optimized_path||p.thumbnail_path),p.title,meta+(p.caption?(meta?' — ':'')+p.caption:''),p.description);
}

function filteredPhotos(){
  return ALL_PHOTOS.filter(p=>
    (filtroDecada==='Tudo'||p.decada===filtroDecada) &&
    (filtroColecao==='Tudo'||p.colecoes.includes(filtroColecao)) &&
    (filtroFamilia==='Tudo'||p.familias.includes(filtroFamilia)) &&
    (filtroPessoa==='Tudo'||p.pessoas.includes(filtroPessoa))
  );
}

function renderCarousel(startId){
  const list=filteredPhotos();
  if(!list.length){ $('#cfRoot').innerHTML='<p class="empty-note">Nenhuma foto nesse filtro ainda.</p>'; return; }
  const slides=list.map(p=>({
    src:photoUrl(p.thumbnail_path),
    alt:p.title||'',
    title:p.title,
    subtitle:[p.photo_date?p.photo_date.slice(0,4):'',p.places?.name||''].filter(Boolean).join(' · '),
    legenda:p.caption||''
  }));
  const startIndex=Math.max(0,list.findIndex(p=>p.id===startId));
  initCoverflow($('#cfRoot'),slides,{
    startIndex,
    onCardClick:(_,i)=>openPhotoLightbox(list[i])
  });
}

function filtroGrupoHtml(rotulo,items,valorAtual,grupo){
  return `<div class="filtros-grupo"><label class="rotulo" for="filtro-${grupo}">${escapeHtml(rotulo)}</label>
    <select class="select-filtro" id="filtro-${grupo}" data-grupo="${grupo}">
      ${['Tudo',...items].map(f=>`<option value="${escapeHtml(f)}" ${f===valorAtual?'selected':''}>${escapeHtml(f)}</option>`).join('')}
    </select>
  </div>`;
}

function renderFiltros(decadas,colecoes,familias,pessoas){
  const parts=[filtroGrupoHtml('Década',decadas,filtroDecada,'decada')];
  if(colecoes.length) parts.push(filtroGrupoHtml('Coleção',colecoes,filtroColecao,'colecao'));
  if(familias.length) parts.push(filtroGrupoHtml('Família',familias,filtroFamilia,'familia'));
  if(pessoas.length) parts.push(filtroGrupoHtml('Pessoa',pessoas,filtroPessoa,'pessoa'));
  $('#filtrosWrap').innerHTML=parts.join('');
  document.querySelectorAll('.select-filtro').forEach(sel=>sel.addEventListener('change',()=>{
    if(sel.dataset.grupo==='decada') filtroDecada=sel.value;
    else if(sel.dataset.grupo==='colecao') filtroColecao=sel.value;
    else if(sel.dataset.grupo==='familia') filtroFamilia=sel.value;
    else filtroPessoa=sel.value;
    renderCarousel();
  }));
}

async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('main h1'),{stagger:35});
  const {data:photos}=await sbClient.from('photos').select('id,title,caption,description,thumbnail_path,optimized_path,photo_date,places(name),album_photos(albums(title)),photo_people(people(full_name,surname))').eq('hide_from_gallery',false).order('photo_date',{ascending:false,nullsFirst:false});
  if(!photos||!photos.length){
    $('#gallerySummary').textContent='';
    $('#cfRoot').innerHTML='<p class="empty-note">Nenhuma foto publicada ainda.</p>';
    return;
  }
  ALL_PHOTOS=photos.map(p=>({
    ...p,
    decada:p.photo_date?(Math.floor(Number(p.photo_date.slice(0,4))/10)*10)+'s':'Sem data',
    colecoes:(p.album_photos||[]).map(ap=>ap.albums?.title).filter(Boolean),
    pessoas:(p.photo_people||[]).map(pp=>pp.people?.full_name).filter(Boolean),
    familias:[...new Set((p.photo_people||[]).flatMap(pp=>pp.people?surnameTokens(pp.people):[]))]
  }));
  $('#gallerySummary').textContent=`${photos.length} ${photos.length===1?'imagem digitalizada':'imagens digitalizadas'} neste acervo.`;
  const decadas=[...new Set(ALL_PHOTOS.map(p=>p.decada))].sort();
  const colecoes=[...new Set(ALL_PHOTOS.flatMap(p=>p.colecoes))].sort();
  const familias=[...new Set(ALL_PHOTOS.flatMap(p=>p.familias))].sort();
  const pessoas=[...new Set(ALL_PHOTOS.flatMap(p=>p.pessoas))].sort();
  renderFiltros(decadas,colecoes,familias,pessoas);
  if(!reduceMotion){ revealBlock($('#gallerySummary')); revealBlock($('#filtrosWrap'),100); }

  const focoFoto=new URLSearchParams(location.search).get('foto');
  renderCarousel(focoFoto);
  if(focoFoto){
    const p=ALL_PHOTOS.find(x=>x.id===focoFoto);
    if(p) openPhotoLightbox(p);
  }
}
boot();
</script>
</body>
</html>
