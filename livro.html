<body>
<main id="main"><p class="empty-note" style="padding:60px 48px;color:#98A2B0">Carregando…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>

<script>
let CAP_GROUPS=[], capIndex=0, BOOK=null;

/* ---------- Leitura em voz alta (Web Speech API do navegador) ----------
   Versão simples: lê o capítulo atual seção por seção, um parágrafo/bloco
   por vez (evita o bug de navegadores que cortam a fala no meio de um
   trecho muito longo), destacando o trecho sendo lido. "Pausar" cancela a
   fala guardando a posição; "continuar" repete o trecho atual do início —
   é a forma confiável de pausar entre navegadores (pause/resume nativo do
   speechSynthesis é bem instável, principalmente no Android). */
let ttsQueue=[], ttsIndex=-1, ttsPlaying=false, ttsVoice=null;
const TTS_SUPPORTED='speechSynthesis' in window;
function pickPtVoice(){
  const voices=speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='pt-BR')||voices.find(v=>(v.lang||'').startsWith('pt'))||null;
}
if(TTS_SUPPORTED){
  ttsVoice=pickPtVoice();
  speechSynthesis.onvoiceschanged=()=>{ ttsVoice=pickPtVoice(); };
}
function clearReadingHighlight(){ document.querySelectorAll('[data-reading]').forEach(el=>el.removeAttribute('data-reading')); }
function buildTtsQueue(){
  const chunks=[];
  const kicker=$('#chapterKicker'), title=$('#chapterTitle');
  if(kicker&&kicker.textContent.trim()) chunks.push({el:kicker,text:kicker.textContent.trim()});
  if(title&&title.textContent.trim()) chunks.push({el:title,text:title.textContent.trim()});
  document.querySelectorAll('#chapterBody .reader-section').forEach(sec=>{
    const subtitle=sec.querySelector('.section-title');
    if(subtitle&&subtitle.textContent.trim()) chunks.push({el:subtitle,text:subtitle.textContent.trim()});
    const body=sec.querySelector(':scope > div');
    if(!body) return;
    const blocks=body.querySelectorAll('p,li,h1,h2,h3,h4,blockquote');
    const list=blocks.length?[...blocks]:[body];
    list.forEach(el=>{ const text=(el.textContent||'').trim(); if(text) chunks.push({el,text}); });
  });
  return chunks;
}
function updateReadBtn(){
  const btn=$('#readAloudBtn'); if(!btn) return;
  btn.textContent=ttsPlaying?'⏸ Pausar leitura':(ttsIndex>=0?'▶ Continuar leitura':'▶ Ouvir capítulo');
}
function speakChunk(i){
  clearReadingHighlight();
  if(i<0||i>=ttsQueue.length){ ttsPlaying=false; ttsIndex=-1; ttsQueue=[]; updateReadBtn(); return; }
  ttsIndex=i;
  const chunk=ttsQueue[i];
  chunk.el.setAttribute('data-reading','');
  chunk.el.scrollIntoView({block:'center',behavior:'smooth'});
  const utter=new SpeechSynthesisUtterance(chunk.text);
  utter.lang='pt-BR';
  if(ttsVoice) utter.voice=ttsVoice;
  utter.onend=()=>{ if(ttsPlaying) speakChunk(ttsIndex+1); };
  utter.onerror=()=>{ if(ttsPlaying) speakChunk(ttsIndex+1); };
  speechSynthesis.speak(utter);
}
function toggleReadAloud(){
  if(!TTS_SUPPORTED) return;
  if(ttsPlaying){ ttsPlaying=false; speechSynthesis.cancel(); updateReadBtn(); return; }
  ttsPlaying=true;
  if(!ttsQueue.length) ttsQueue=buildTtsQueue();
  updateReadBtn();
  speakChunk(ttsIndex<0?0:ttsIndex);
}
function stopReadAloud(){
  speechSynthesis.cancel();
  ttsPlaying=false; ttsQueue=[]; ttsIndex=-1;
  clearReadingHighlight(); updateReadBtn();
}

function renderChapter(){
  stopReadAloud();
  const grupo=CAP_GROUPS[capIndex];
  $('#readerProgress').style.transform=`scaleX(${(capIndex+1)/CAP_GROUPS.length})`;
  document.querySelectorAll('.chapter-nav-item').forEach((el,i)=>el.classList.toggle('active',i===capIndex));
  $('#chapterKicker').textContent=`Capítulo ${grupo.num}`;
  $('#chapterTitle').textContent=grupo.titulo;
  $('#chapterBody').innerHTML=grupo.secoes.map(s=>`<div class="reader-section">
    ${s.subtitle?`<p class="section-title">${escapeHtml(s.subtitle)}</p>`:''}
    <div>${s.content||''}</div></div>`).join('<hr style="border:0;border-top:1px solid rgba(26,31,38,.12);margin:36px 0">');
  $('#prevChapterBtn').disabled=capIndex<=0;
  $('#nextChapterBtn').disabled=capIndex>=CAP_GROUPS.length-1;
  window.scrollTo(0,0);
}

async function boot(){
  renderHeader(); renderFooter();
  const key=new URLSearchParams(location.search).get('slug')||new URLSearchParams(location.search).get('id');
  let book=null, multipleBooks=false;
  if(key){
    // Livro específico pedido por slug/id (link direto, vindo de livros.html ou
    // compartilhado) — busca só ele, e separadamente checa se existe mais de um
    // livro no acervo pra decidir se mostra o link "Todos os livros" no menu.
    let query=sbClient.from('books').select('id,title,subtitle,description,slug');
    query=/^[0-9a-f-]{36}$/i.test(key)?query.eq('id',key):query.eq('slug',key);
    const [{data:foundBook},{count}]=await Promise.all([
      query.maybeSingle(),
      sbClient.from('books').select('id',{count:'exact',head:true})
    ]);
    book=foundBook;
    multipleBooks=(count||0)>1;
  } else {
    // Sem parâmetro (link antigo, ou clique direto em "livro.html"): só faz
    // sentido abrir um livro específico sem pedir escolha se existe exatamente
    // um no acervo. Com dois ou mais, manda pra lista em vez de escolher um
    // arbitrariamente e "sumir" com os outros.
    const {data:allBooks}=await sbClient.from('books').select('id,slug,title,subtitle,description').order('updated_at',{ascending:false}).limit(2);
    if(allBooks&&allBooks.length>1){ location.replace('livros.html'); return; }
    book=allBooks?.[0]||null;
  }
  if(!book){
    $('#main').innerHTML=`<div class="empty-state-public"><h3>${key?'Livro não encontrado':'Nenhum livro publicado ainda'}</h3>${key?'<p><a href="livros.html">← Ver todos os livros</a></p>':''}</div>`;
    return;
  }
  BOOK=book;
  setPageMeta({
    title:book.title+' — Olsen · Belloto · Leal',
    description:truncate(book.description||book.subtitle,155)||`O livro ${book.title}, da família Olsen, Belloto e Leal.`,
    url:location.href
  });
  const {data:chapters}=await sbClient.from('chapters').select('chapter_number,title,subtitle,content,created_at').eq('book_id',book.id).order('chapter_number',{ascending:true}).order('created_at',{ascending:true});
  if(!chapters||!chapters.length){
    $('#main').innerHTML=`<div class="empty-state-public"><h3>Este livro ainda não tem capítulos publicados</h3>${multipleBooks?'<p><a href="livros.html">← Ver todos os livros</a></p>':''}</div>`;
    return;
  }
  const groups=new Map();
  chapters.forEach(c=>{
    if(!groups.has(c.chapter_number)) groups.set(c.chapter_number,{num:c.chapter_number,titulo:c.title,secoes:[]});
    groups.get(c.chapter_number).secoes.push({subtitle:c.subtitle,content:c.content});
  });
  CAP_GROUPS=[...groups.values()].sort((a,b)=>a.num-b.num);

  $('#main').innerHTML=`
  <div class="reader-main">
    <div class="reader-progress"><div class="reader-progress-bar" id="readerProgress" style="transform:scaleX(0)"></div></div>
    <div class="reader-grid">
      <aside class="reader-aside">
        <p class="kicker">Livro da família</p>
        <h2>${escapeHtml(book.title)}</h2>
        <p class="sub">${escapeHtml(book.subtitle||book.description||'')}</p>
        ${multipleBooks?'<a class="btn-outline-gold" href="livros.html" style="display:inline-block;margin-bottom:26px">← Todos os livros</a>':''}
        <nav class="chapter-nav" id="chapterNav">
          ${CAP_GROUPS.map((g,i)=>`<button type="button" class="chapter-nav-item" data-i="${i}"><span class="num">${escapeHtml(String(g.num))}</span><span><span class="titulo">${escapeHtml(g.titulo)}</span></span></button>`).join('')}
        </nav>
      </aside>
      <article class="reader-article">
        <p class="kicker" id="chapterKicker"></p>
        <h1 id="chapterTitle"></h1>
        <div class="reader-body" id="chapterBody"></div>
        <div class="reader-nav-buttons">
          <button type="button" class="btn-sm" id="prevChapterBtn">← Anterior</button>
          <button type="button" class="btn-dark" id="nextChapterBtn">Próximo capítulo →</button>
        </div>
      </article>
    </div>
    <div class="reader-audio" ${TTS_SUPPORTED?'':'hidden'}>
      <button type="button" class="reader-audio-btn" id="readAloudBtn">▶ Ouvir capítulo</button>
    </div>
  </div>`;

  document.querySelectorAll('.chapter-nav-item').forEach(b=>b.addEventListener('click',()=>{capIndex=Number(b.dataset.i); renderChapter();}));
  $('#prevChapterBtn').addEventListener('click',()=>{ if(capIndex>0){capIndex--; renderChapter();} });
  $('#nextChapterBtn').addEventListener('click',()=>{ if(capIndex<CAP_GROUPS.length-1){capIndex++; renderChapter();} });
  $('#readAloudBtn')?.addEventListener('click',toggleReadAloud);
  renderChapter();
  // só na primeira montagem da página — trocar de capítulo continua instantâneo,
  // sem repetir a animação toda vez (senão vira empecilho pra quem tá lendo).
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    revealBlock($('.reader-aside'));
    revealBlock($('.reader-article'),120);
  }
}
boot();
</script>
