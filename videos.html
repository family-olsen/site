<style>
  .video-list{display:flex;flex-direction:column;gap:clamp(40px,6vw,64px);margin-top:clamp(30px,5vw,56px)}
  .video-item .frame-wrap{max-width:440px;transition:max-width .35s ease}
  .video-item.expanded .frame-wrap{max-width:100%}
  .video-item .frame{position:relative;width:100%;padding-top:56.25%;border-radius:14px;overflow:hidden;background:var(--bg-3);background-size:cover;background-position:center}
  .video-item .frame iframe,.video-item .frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg-3)}
  .video-item .play-cover{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:var(--bg-3);display:grid;place-items:center;cursor:pointer}
  .video-item .frame.has-thumb .play-cover{background:rgba(11,18,32,.42)}
  .video-item .play-cover .play-icon{width:26%;max-width:56px;color:var(--gold);opacity:.9;transition:transform .25s ease,opacity .25s ease}
  .video-item .play-cover:hover .play-icon{transform:scale(1.12);opacity:1}
  .video-item .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-top:18px}
  .video-item .titulo{font-family:var(--serif);font-weight:300;font-size:clamp(20px,2.4vw,26px);margin:0 0 6px;letter-spacing:-.01em}
  .video-item .resumo{font-size:14px;line-height:1.7;color:var(--muted-2);margin:0;max-width:70ch}
  .video-expand-btn{flex:none;font-family:var(--sans);font-size:var(--fs-label);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:none;border:1px solid var(--line-gold);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s}
  .video-expand-btn:hover{background:var(--gold);color:var(--bg)}
</style>
</head>
<body>
<main>
  <div class="section-tight" style="padding-top:clamp(10px,1.5vw,20px)">
    <div class="wrap-narrow">
      <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,64px);margin:0 0 14px;letter-spacing:-.02em">Vídeos</h1>
      <p style="font-size:15px;line-height:1.7;color:var(--muted-2);max-width:560px;margin:0" id="summary">Carregando…</p>
    </div>
    <div class="wrap">
      <div class="video-list" id="list"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('main h1'),{stagger:35});

  const {data:videos}=await sbClient.from('sources').select('id,title,description,url,video_order').eq('source_type','video').eq('show_in_videos',true).order('video_order',{ascending:true,nullsFirst:false});

  if(!videos||!videos.length){
    $('#summary').textContent='';
    $('#list').innerHTML='<p class="empty-note">Nenhum vídeo publicado ainda.</p>';
    revealBlock($('#list'));
    return;
  }

  $('#summary').textContent=`${videos.length} ${videos.length===1?'vídeo publicado':'vídeos publicados'} neste acervo.`;

  const playCoverHtml=`<button type="button" class="play-cover" aria-label="Tocar vídeo"><svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.29 1.55.87l10.83-6.86a1 1 0 0 0 0-1.72L9.55 4.27C8.87 3.85 8 4.34 8 5.14Z"/></svg></button>`;
  $('#list').innerHTML=videos.map(v=>{
    const thumb=archiveThumbUrl(v.url);
    return `<div class="video-item">
    <div class="frame-wrap"><div class="frame${thumb?' has-thumb':''}" data-url="${escapeHtml(v.url||'')}" data-title="${escapeHtml(v.title||'Vídeo')}"${thumb?` style="background-image:url('${escapeHtml(thumb)}')"`:''}>${v.url?playCoverHtml:''}</div></div>
    <div class="head">
      <p class="titulo">${escapeHtml(v.title||'Sem título')}</p>
      <button type="button" class="video-expand-btn">Expandir vídeo</button>
    </div>
    ${v.description?`<p class="resumo">${escapeHtml(v.description)}</p>`:''}
  </div>`;
  }).join('');

  document.querySelectorAll('.video-expand-btn').forEach(btn=>btn.addEventListener('click',()=>{
    const item=btn.closest('.video-item');
    const expanded=item.classList.toggle('expanded');
    btn.textContent=expanded?'Recolher vídeo':'Expandir vídeo';
  }));

  // Nunca dois vídeos tocando ao mesmo tempo: o player só carrega de verdade
  // (iframe com src) quando a pessoa clica em play; dar play em outro larga o
  // que estava tocando (troca o iframe de volta pela capa com play), o que
  // efetivamente para ele — não dá pra pausar um iframe de outro site (cross-
  // origin), então a única forma confiável de garantir isso é nunca deixar
  // dois <iframe> carregados ao mesmo tempo.
  function stopOtherVideos(exceptFrame){
    document.querySelectorAll('.frame.playing').forEach(frame=>{
      if(frame===exceptFrame) return;
      frame.classList.remove('playing');
      frame.innerHTML=playCoverHtml;
      wirePlayCover(frame);
    });
  }
  function playVideo(frame){
    stopOtherVideos(frame);
    const url=frame.dataset.url;
    if(!url) return;
    if(isDirectVideoUrl(url)){
      frame.innerHTML=`<video controls autoplay playsinline title="${escapeHtml(frame.dataset.title)}"><source src="${escapeHtml(url)}"></video>`;
    } else {
      const sep=url.includes('?')?'&':'?';
      frame.innerHTML=`<iframe src="${escapeHtml(url+sep+'autoplay=1')}" allow="autoplay" allowfullscreen loading="lazy" title="${escapeHtml(frame.dataset.title)}"></iframe>`;
    }
    frame.classList.add('playing');
  }
  function wirePlayCover(frame){
    frame.querySelector('.play-cover')?.addEventListener('click',()=>playVideo(frame));
  }
  document.querySelectorAll('.frame').forEach(wirePlayCover);

  if(!reduceMotion){
    revealBlock($('#summary'));
    initScrollReveal('.video-item',{stagger:60});
  }
}
boot();
</script>
</body>
