<link rel="stylesheet" href="css/site.css">
<style>
  .book-row{display:grid;grid-template-columns:220px 1fr;gap:26px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:26px 0;cursor:pointer;color:inherit;font-family:inherit;transition:background .3s}
  .book-row:hover{background:rgba(237,231,220,.04)}
  .book-row .thumb{height:140px;border-radius:14px;background:var(--bg-3);background-size:cover;background-position:center;filter:saturate(.6) brightness(.85)}
  /* mesmo ajuste de historias.html: no mobile a coluna fixa de 220px espremia o
     texto numa faixa estreita — aqui a capa vira uma faixa larga em cima. */
  @media (max-width:600px){
    .book-row{grid-template-columns:1fr;gap:14px}
    .book-row .thumb{height:52vw;max-height:220px}
  }
</style>
</head>
<body>
<main>
  <div class="section-tight" style="padding-top:clamp(10px,1.5vw,20px)">
    <div class="wrap">
      <h1 style="font-family:var(--serif);font-weight:300;font-size:clamp(34px,6vw,64px);margin:0 0 14px;letter-spacing:-.02em">Livros</h1>
      <p style="font-size:15px;line-height:1.7;color:var(--muted-2);max-width:560px;margin:0" id="summary">Carregando…</p>
      <div id="list" style="margin-top:26px"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script>
async function boot(){
  renderHeader(); renderFooter();
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion) revealWords($('main h1'),{stagger:35});

  const [{data:books},{data:chapters}]=await Promise.all([
    sbClient.from('books').select('id,slug,title,subtitle,description,cover_path').order('updated_at',{ascending:false}),
    sbClient.from('chapters').select('book_id,chapter_number')
  ]);

  if(!books||!books.length){
    $('#summary').textContent='';
    $('#list').innerHTML='<p class="empty-note">Nenhum livro publicado ainda.</p>';
    revealBlock($('#list'));
    return;
  }
  // Só um livro no acervo: a lista não tem escolha nenhuma pra fazer, então
  // pula direto pra leitura em vez de mostrar uma galeria de um item só.
  if(books.length===1){
    location.replace(`livro.html?slug=${books[0].slug||books[0].id}`);
    return;
  }

  // Um livro pode ter várias seções sob o mesmo número de capítulo (livro.html
  // agrupa isso na leitura) — conta números de capítulo distintos por livro,
  // não linhas cruas da tabela, senão o número sai inflado.
  const chapterNumsByBook=new Map();
  (chapters||[]).forEach(c=>{
    if(!chapterNumsByBook.has(c.book_id)) chapterNumsByBook.set(c.book_id,new Set());
    chapterNumsByBook.get(c.book_id).add(c.chapter_number);
  });

  $('#summary').textContent=`${books.length} ${books.length===1?'livro publicado':'livros publicados'} neste acervo.`;

  $('#list').innerHTML=books.map(b=>{
    const n=chapterNumsByBook.get(b.id)?.size||0;
    return `<a class="book-row" href="livro.html?slug=${b.slug||b.id}">
      <span class="thumb" style="${b.cover_path?`background-image:url('${photoUrl(b.cover_path)}')`:''}"></span>
      <span>
        <span class="list-meta">${n} ${n===1?'capítulo publicado':'capítulos publicados'}</span>
        <span class="list-title" style="font-size:26px">${escapeHtml(b.title)}</span>
        ${b.subtitle?`<span class="list-resumo">${escapeHtml(b.subtitle)}</span>`:''}
        ${b.description?`<span class="list-resumo">${escapeHtml(b.description)}</span>`:''}
      </span>
    </a>`;
  }).join('');

  if(!reduceMotion){
    revealBlock($('#summary'));
    revealBlock($('#list'),120);
  }
}
boot();
</script>
</body>
</html>
